# Reusa el resultado de una task cuando sus entradas no cambiaron, incluso entre
# builds distintos. Lo que hace que ./gradlew check despues de tocar un solo
# modulo no vuelva a compilar y testear los otros nueve.
org.gradle.caching=true

# Los diez modulos no dependen todos de todos: common y token pueden compilarse
# mientras se testea otro. Sin esto Gradle los hace de a uno.
org.gradle.parallel=true
