[versions]
kotlin = "2.4.10"
junit = "5.11.4"
jvm = "21"
ktlint = "12.1.1"

[libraries]
# Se usa como dependencia de buildSrc para poner el Kotlin Gradle Plugin en el
# classpath de los convention plugins (ahi el bloque plugins {} no lleva version).
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# Idem para ktlint: el artefacto terminado en ".gradle.plugin" es el "plugin marker",
# lo unico que hace falta para poder escribir id("...") sin version en el convention plugin.
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle.ktlint:org.jlleitschuh.gradle.ktlint.gradle.plugin", version.ref = "ktlint" }


junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
